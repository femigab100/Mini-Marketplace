<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browse products in the Mini Marketplace.">
  <title>Mini Marketplace | Products</title>
  <link rel="stylesheet" href="style.css">
  <script src="products.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#" aria-label="Mini Marketplace home">
        <span class="brand-mark" aria-hidden="true">M</span>
        <span>Mini<span class="brand-accent">Market</span></span>
      </a>
      <div class="header-note">Simple shopping, made easy</div>
      <!-- The integration developer can add the cart badge/navigation here. -->
    </div>
  </header>

  <main class="page-container">
    <section class="intro">
      <p class="eyebrow">THE MARKETPLACE</p>
      <h1>Find something you'll love.</h1>
      <p class="intro-copy">Browse our collection, search for a product, or narrow your options by category.</p>
    </section>

    <section class="catalogue" aria-labelledby="catalogue-heading">
      <div class="catalogue-heading">
        <div>
          <h2 id="catalogue-heading">Our products</h2>
          <p id="resultsCount" class="results-count" aria-live="polite">Preparing products…</p>
        </div>
      </div>

      <div class="toolbar">
        <label class="search-control" for="searchInput">
          <span class="visually-hidden">Search products</span>
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input
            type="search"
            id="searchInput"
            placeholder="Search products by name…"
            autocomplete="off"
          >
        </label>

        <label class="category-control" for="categoryFilter">
          <span class="visually-hidden">Filter by category</span>
          <select id="categoryFilter">
            <option value="all">All categories</option>
          </select>
        </label>
      </div>

      <p id="loadingMessage" class="status-message" role="status">Loading products…</p>
      <div id="errorMessage" class="error-message" role="alert" hidden></div>
      <div id="productsContainer" class="products-grid" aria-live="polite"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>Mini Marketplace · Products demonstration</p>
  </footer>
</body>
</html>
