<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browse products at MiniMart. Search by title or filter by category.">
  <title>MiniMart | Products</title>

  <!-- Typeface: DM Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  
</head>
<body>

  <!-- ========== HEADER ========== -->
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html" aria-label="MiniMart home">
        <span class="brand-accent">Mini</span>Mart
      </a>

      <!-- Navigation. The Cart and Integration members can add more links
           here and update #cartCount from cart.js / main.js. -->
      <nav class="main-nav" aria-label="Main navigation">
        <a class="nav-link is-active" href="index.html" aria-current="page">Products</a>

        <button type="button" class="cart-button" id="cartButton" aria-label="View cart">
          <svg class="cart-icon" viewBox="0 0 24 24" width="20" height="20" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true" focusable="false">
            <circle cx="8" cy="21" r="1"></circle>
            <circle cx="19" cy="21" r="1"></circle>
            <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"></path>
          </svg>
          <span class="cart-label">Cart</span>
          <span class="cart-badge" id="cartCount">0</span>
        </button>
      </nav>
    </div>
  </header>

  <!-- ========== PRODUCTS PAGE ========== -->
  <main class="page-container">

    <section class="intro">
      <p class="eyebrow">Our store</p>
      <h1>Products</h1>
      <p class="intro-copy">Find the things you need, all in one place.</p>
    </section>

    <section class="catalogue" aria-labelledby="catalogue-heading">
      <h2 id="catalogue-heading" class="visually-hidden">Product listing</h2>

      <!-- Search and category filter -->
      <div class="toolbar">
        <div class="field">
          <label class="field-label" for="searchInput">Search</label>
          <div class="control search-control">
            <svg class="search-icon" viewBox="0 0 24 24" width="24" height="24" fill="none"
                 stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                 aria-hidden="true" focusable="false">
              <circle cx="11" cy="11" r="7.5"></circle>
              <path d="m20.5 20.5-4.2-4.2"></path>
            </svg>
            <input type="search" id="searchInput" placeholder="Search products by title" autocomplete="off">
          </div>
        </div>

        <div class="field">
          <label class="field-label" for="categoryFilter">Category</label>
          <div class="control select-control">
            <select id="categoryFilter">
              <option value="all">All categories</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Written to by products.js -->
      <p id="resultsCount" class="visually-hidden" aria-live="polite"></p>
      <p id="loadingMessage" class="status-message" role="status">Loading products…</p>
      <div id="errorMessage" class="error-message" role="alert" hidden></div>
      <div id="productsContainer" class="products-grid" aria-live="polite"></div>
    </section>

  </main>

<script src="products.js" defer></script>
<script src="cart.js" defer></script>


</body>
</html>
